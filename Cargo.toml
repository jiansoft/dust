[package]
name = "dust"
version = "0.1.1"
edition = "2024"

build = "build.rs"

[dependencies]
dialoguer = "0.12"
clap = { version = "4.6", features = ["derive"] }
globset = "0.4"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"

[build-dependencies]
embed-resource = "3.0"
